# Firebase App Hosting runtime config.
#
# Lives beside package.json rather than at the repo root, because the backend's
# rootDir is src/frontend. App Hosting looks for this file at the root it was
# given, not at the top of the repository.
#
# Secrets are referenced by NAME, never pasted in as literal values: this file
# is committed to a repository. Plain `value:` entries below are all public by
# nature -- a URL, and the OAuth client id, which is shipped to every browser in
# the consent link anyway.

env:
  # Where Google sends students back. Must match the connector's
  # OAUTH_REDIRECT_URI byte for byte, and must be listed as an authorised
  # redirect URI on the OAuth client, or the exchange fails.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://classistant--classisstant.us-central1.hosted.app
    availability: [BUILD, RUNTIME]

  # Public half of the OAuth client. Safe to commit; the secret half is mounted
  # into the connector service on Cloud Run and never reaches this app.
  - variable: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    value: 945345983057-v45ksbfcu1epohvq1cb1asfqvfp3u9ek.apps.googleusercontent.com
    availability: [BUILD, RUNTIME]

  # Server-to-server only. Deliberately not NEXT_PUBLIC_: the connector is
  # currently deployed --allow-unauthenticated, so there is no reason to hand
  # its address to every browser as well.
  - variable: CONNECTORS_API_URL
    value: https://classistant-connectors-945345983057.us-central1.run.app
    availability: [RUNTIME]

  # HMAC key for the onboarding cookie (lib/onboardingSession.ts). No longer
  # signs the session: that is a Firebase Auth session cookie now.
  - variable: SESSION_SECRET
    secret: session-secret
    availability: [RUNTIME]

  # --------------------------------------------------------------- Firebase
  # Web config for Firebase Auth in the browser (lib/firebaseClient.ts).
  #
  # All four are public. The API key is not a credential: every Firebase web app
  # ships it to every browser, and access is controlled by Auth and IAM. There
  # is nothing here that is not already visible in the page source.
  #
  # BUILD availability is not optional. Next inlines NEXT_PUBLIC_* at build
  # time, so a value that only exists at RUNTIME compiles to `undefined` and
  # sign-in fails in production while working perfectly on a dev machine that
  # has a .env.local. Keep these in sync with src/frontend/.env.example.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCA4XkNFqVLTq-GxKDppjw6WqamR4AUrKA
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: classisstant.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:945345983057:web:fc8f467dc0474f2d21be70
    availability: [BUILD, RUNTIME]

  # Read by the client SDK and, as a fallback, by firebase-admin. The project id
  # really is spelled with two s's; the product is not.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: classisstant
    availability: [BUILD, RUNTIME]

runConfig:
  # A marketing site with bursty term-start traffic and long quiet stretches.
  # Scaling to zero is the right default; the cold start costs a first visitor
  # a second, and paying for an idle instance year-round to avoid that is a bad
  # trade before there is real traffic to measure.
  minInstances: 0
  maxInstances: 10

  # The pages are static or lightly server-rendered, so a single instance
  # handles many requests at once. Raise memory before concurrency if the build
  # ever starts holding real work in memory.
  concurrency: 80
  cpu: 1
  memoryMiB: 512
